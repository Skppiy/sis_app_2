<!DOCTYPE html>
<html>
<head>
    <title>SIS API Validation Test</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>SIS API Validation Test</h1>
    <div id="output"></div>

    <script>
        async function logResult(section, message, data = null, type = 'info') {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.className = `test-section ${type}`;
            
            let content = `<h3>[${section}] ${message}</h3>`;
            if (data) {
                content += `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
            
            div.innerHTML = content;
            output.appendChild(div);
            
            // Also log to console
            console.log(`[${section}] ${message}`, data || '');
        }

        async function testAPI(endpoint, description) {
            try {
                const response = await fetch(`http://localhost:8000${endpoint}`, {
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                await logResult(description, 'Success', data, 'success');
                return data;
            } catch (error) {
                await logResult(description, `Failed: ${error.message}`, null, 'error');
                return null;
            }
        }

        async function analyzeTeacherAssignments(classroomsData) {
            if (!classroomsData || classroomsData.length === 0) {
                await logResult('ANALYSIS', 'No classroom data to analyze', null, 'warning');
                return;
            }

            await logResult('ANALYSIS', `Analyzing ${classroomsData.length} classrooms`);
            
            let assignmentCount = 0;
            let teacherUserIdPresent = 0;
            let teacherObjectPresent = 0;
            let teacherIdPresent = 0;
            let mismatches = [];

            classroomsData.forEach((classroom, idx) => {
                if (classroom.teacher_assignments && classroom.teacher_assignments.length > 0) {
                    classroom.teacher_assignments.forEach((assignment, assignIdx) => {
                        assignmentCount++;
                        
                        const hasTeacherUserId = !!assignment.teacher_user_id;
                        const hasTeacherObject = !!assignment.teacher;
                        const hasTeacherId = assignment.teacher?.id;
                        
                        if (hasTeacherUserId) teacherUserIdPresent++;
                        if (hasTeacherObject) teacherObjectPresent++;
                        if (hasTeacherId) teacherIdPresent++;
                        
                        // Check for mismatches
                        if (hasTeacherUserId && hasTeacherId && assignment.teacher_user_id !== assignment.teacher.id) {
                            mismatches.push({
                                classroom: classroom.name,
                                classroomIdx: idx,
                                assignmentIdx: assignIdx,
                                teacher_user_id: assignment.teacher_user_id,
                                teacher_id: assignment.teacher.id,
                                teacher_name: `${assignment.teacher.first_name} ${assignment.teacher.last_name}`
                            });
                        }
                    });
                }
            });

            const analysisResults = {
                totalAssignments: assignmentCount,
                stats: {
                    teacher_user_id_present: teacherUserIdPresent,
                    teacher_object_present: teacherObjectPresent,
                    teacher_id_present: teacherIdPresent
                },
                mismatches: mismatches,
                sampleAssignment: classroomsData[0]?.teacher_assignments?.[0] || null
            };

            await logResult('ID ANALYSIS', 'Teacher Assignment Field Analysis', analysisResults, 
                mismatches.length > 0 ? 'error' : 'success');
            
            return analysisResults;
        }

        async function testEnrichmentLogic(classroomsData, teachersData) {
            if (!classroomsData || !teachersData) {
                await logResult('ENRICHMENT', 'Cannot test enrichment - missing data', null, 'error');
                return;
            }

            // Simulate the current broken enrichment logic
            const teacherToHomeroom = new Map();
            const teacherToSpecialistRoom = new Map();
            const teacherToStudentCount = new Map();
            
            let processingErrors = [];

            classroomsData.forEach((classroom) => {
                classroom.teacher_assignments?.forEach(assignment => {
                    if (assignment.teacher && assignment.is_active) {
                        try {
                            // This is the BROKEN line from the current code
                            const teacherId = assignment.teacher_user_id; // Should be assignment.teacher.id
                            
                            if (!teacherId) {
                                processingErrors.push({
                                    classroom: classroom.name,
                                    error: 'teacher_user_id is null/undefined',
                                    assignment: assignment
                                });
                                return;
                            }
                            
                            const roomName = classroom.room?.name || classroom.name;
                            const studentCount = classroom.enrollment_count || 0;
                            
                            const currentCount = teacherToStudentCount.get(teacherId) || 0;
                            teacherToStudentCount.set(teacherId, currentCount + studentCount);
                            
                            if (classroom.classroom_type === 'CORE' || assignment.role_name?.includes('homeroom')) {
                                teacherToHomeroom.set(teacherId, roomName);
                            } else {
                                teacherToSpecialistRoom.set(teacherId, roomName);
                            }
                        } catch (err) {
                            processingErrors.push({
                                classroom: classroom.name,
                                error: err.message,
                                assignment: assignment
                            });
                        }
                    }
                });
            });

            // Try to match teachers
            let enrichedTeachers = [];
            let matchingErrors = [];

            teachersData.forEach(teacher => {
                const homeroom = teacherToHomeroom.get(teacher.id);
                const specialistRoom = teacherToSpecialistRoom.get(teacher.id);
                const studentCount = teacherToStudentCount.get(teacher.id) || 0;
                
                if (!homeroom && !specialistRoom && studentCount === 0) {
                    matchingErrors.push({
                        teacher: `${teacher.first_name} ${teacher.last_name}`,
                        teacher_id: teacher.id,
                        issue: 'No classroom assignments found'
                    });
                }
                
                enrichedTeachers.push({
                    ...teacher,
                    homeroom_name: homeroom,
                    specialist_room_name: specialistRoom,
                    student_count: studentCount
                });
            });

            const enrichmentResults = {
                processingErrors: processingErrors,
                matchingErrors: matchingErrors,
                enrichedTeachers: enrichedTeachers.slice(0, 3), // First 3 for brevity
                summary: {
                    totalTeachers: teachersData.length,
                    teachersWithRooms: enrichedTeachers.filter(t => t.homeroom_name || t.specialist_room_name).length,
                    teachersWithStudents: enrichedTeachers.filter(t => t.student_count > 0).length
                }
            };

            await logResult('ENRICHMENT TEST', 'Enrichment Logic Test Results', enrichmentResults,
                processingErrors.length > 0 || matchingErrors.length > 5 ? 'error' : 'warning');
            
            return enrichmentResults;
        }

        async function runAllTests() {
            await logResult('STARTUP', 'Starting SIS API Validation Tests...');
            
            // Test both endpoints
            const classroomsData = await testAPI('/classrooms', 'CLASSROOMS API');
            const teachersData = await testAPI('/admin/teachers', 'TEACHERS API');
            
            if (classroomsData) {
                // Analyze teacher assignment structure
                await analyzeTeacherAssignments(classroomsData);
            }
            
            if (classroomsData && teachersData) {
                // Test enrichment logic
                await testEnrichmentLogic(classroomsData, teachersData);
            }
            
            await logResult('COMPLETION', 'All validation tests complete!', null, 'success');
        }

        // Run tests when page loads
        window.onload = () => {
            runAllTests();
        };
    </script>
</body>
</html>
